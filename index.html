<style>
:root{--bg:#f4f4f4;--card:#fff;--text:#111;--muted:#555;--accent:#111;--accent2:#111;--border:#ddd;--glow:transparent;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000;--card:#0a0a0a;--text:#fff;--muted:#a3a3a3;--accent:#fff;--accent2:#fff;--border:#262626;--glow:transparent}}
:root[data-theme="dark"]{--bg:#000;--card:#0a0a0a;--text:#fff;--muted:#a3a3a3;--accent:#fff;--accent2:#fff;--border:#262626;--glow:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;line-height:1.7;
background-image:none}
.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;direction:ltr;unicode-bidi:embed}
.wrap{max-width:820px;margin:0 auto;padding:0 20px 20px}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;backdrop-filter:blur(10px);background:color-mix(in srgb,var(--bg) 70%,transparent)}
.logo{color:var(--accent);font-weight:700}
.links{display:flex;gap:16px;font-size:.92rem}
.links a{color:var(--muted);text-decoration:none}.links a:hover{color:var(--accent)}
.tools{display:flex;gap:8px}
button{background:var(--card);color:var(--text);border:1px solid var(--border);border-radius:10px;padding:7px 13px;font:inherit;font-size:.9rem;cursor:pointer;transition:.2s}
button:hover{border-color:var(--accent);color:var(--accent)}
.hero{text-align:center;padding:70px 0 46px}
.avatar{display:block;width:120px;height:120px;border-radius:50%;object-fit:cover;margin:0 auto 20px;background:#000;animation:float 4s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-6px)}}
h1{margin:0;font-size:clamp(2.2rem,8vw,3.4rem);letter-spacing:-1px;color:var(--text)}
.typed{min-height:1.8em;margin:8px 0 14px;color:var(--accent);font-size:1.05rem}
.typed:after{content:"▍";animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.sub{color:var(--muted);max-width:540px;margin:0 auto 22px}
.btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.cta{display:inline-block;background:var(--accent);color:var(--bg);text-decoration:none;font-weight:700;padding:11px 22px;border-radius:12px;transition:.2s}
.cta:hover{transform:translateY(-2px)}
.ghost{background:transparent;color:var(--text);border:1px solid var(--border)}
section{padding:26px 0}
h2{margin:0 0 16px;font-size:1.25rem}
h2:before{content:"// ";color:var(--accent);font-family:ui-monospace,Consolas,monospace}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:20px;transition:.25s}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}
.grid .card:hover{border-color:var(--accent);transform:translateY(-3px)}
.ico svg,#theme svg{width:30px;height:30px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}#theme{display:grid;place-items:center;padding:7px 10px}#theme svg{width:18px;height:18px}
.card h3{margin:8px 0 4px;font-size:1.02rem}
.card p{margin:0;color:var(--muted);font-size:.92rem}
.term{background:#000;border:1px solid var(--border);border-radius:14px;overflow:hidden;direction:ltr;text-align:left}
.term .top{display:flex;gap:6px;padding:10px 14px;border-bottom:1px solid var(--border)}
.term .top i{width:10px;height:10px;border-radius:50%;background:#ff5f57}
.term .top i:nth-child(2){background:#febc2e}.term .top i:nth-child(3){background:#28c840}
.term pre{margin:0;padding:16px;color:#ddd;font-size:.9rem;line-height:1.8;overflow-x:auto}
.term b{color:#fff;font-weight:400}.term em{color:#aaa;font-style:normal}
.tags{display:flex;flex-wrap:wrap;gap:8px}
.tag{border:1px solid var(--border);background:var(--card);border-radius:999px;padding:5px 15px;font-size:.92rem}
.contact{text-align:center}
footer{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:.85rem;padding:30px 0 10px;direction:ltr}
.rv{opacity:0;transform:translateY(18px);transition:opacity .6s,transform .6s}.rv.in{opacity:1;transform:none}
.face{width:34px;height:34px;flex:none;color:var(--text)}
</style>
</head>
